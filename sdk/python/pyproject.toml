[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tellproof"
version = "0.3.1"
description = "One-line evidence telemetry for AI products: sends model-call facts (never content) to the local Tellproof agent."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lumetrix" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

# The agent, for local development: pip install "tellproof[agent]". Production
# installs need only tellproof; the agent runs beside the app (D-067).
[project.optional-dependencies]
agent = ["tellproof-agent>=0.5.0,<1"]

[project.scripts]
tellproof = "tellproof._cli:main"

[project.urls]
Homepage = "https://lumetrix-advanced-technologies.github.io/tellproof/"
Source = "https://github.com/Lumetrix-Advanced-Technologies/tellproof"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tellproof = ["py.typed"]
