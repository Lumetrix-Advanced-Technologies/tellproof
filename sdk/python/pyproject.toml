[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tellproof"
version = "0.2.0"
description = "One-line evidence telemetry for AI products: sends model-call facts (never content) to the local Tellproof agent."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lumetrix" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Lumetrix-Advanced-Technologies/tellproof"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tellproof = ["py.typed"]
