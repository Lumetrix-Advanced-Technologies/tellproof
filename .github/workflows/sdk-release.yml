# Publishes the SDKs (PyPI and npm, both named tellproof) when a maintainer
# pushes a tag sdk-vX.Y.Z whose version matches sdk/python/pyproject.toml and
# sdk/js/package.json (D-050), after a smoke test of both built packages and
# approval in the `release` environment, with trusted publishing on both
# registries (GitHub's OIDC token; no registry token is stored) (D-061).
name: sdk-release
on:
  push:
    tags: ["sdk-v*"]
permissions: {}
# npm stage needs npm 11.15.0+; an exact version, run with npx (update it by hand).
env: { NPM_VERSION: "11.21.1" }
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs: { version: "${{ steps.v.outputs.version }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - id: v
        run: |
          v="${GITHUB_REF_NAME#sdk-v}"
          py=$(python -c 'import tomllib; print(tomllib.load(open("sdk/python/pyproject.toml","rb"))["project"]["version"])')
          js=$(node -p 'require("./sdk/js/package.json").version')
          [ "$py" = "$v" ] && [ "$js" = "$v" ] || { echo "tag $v, pyproject $py, package.json $js"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: python -m unittest discover -s sdk/python/tests
      - run: node --test sdk/js/test/sdk.test.mjs sdk/js/test/instrument.test.mjs sdk/js/test/cli.test.mjs sdk/js/test/simple.test.mjs
      - name: Smoke test (build both packages, install them, import them)
        env: { V: "${{ steps.v.outputs.version }}" }
        run: |
          python -m venv /tmp/py && /tmp/py/bin/pip install --quiet --require-hashes -r .github/requirements/build.txt
          /tmp/py/bin/python -m build sdk/python --outdir /tmp/dist > /dev/null
          /tmp/py/bin/pip install --quiet /tmp/dist/tellproof-*.whl
          /tmp/py/bin/python -c "import os, tellproof; assert tellproof.__version__ == os.environ['V']; print('python', tellproof.__version__)"
          (cd sdk/js && npm pack --pack-destination /tmp > /dev/null)
          mkdir -p /tmp/npm && tar xzf "/tmp/tellproof-$V.tgz" -C /tmp/npm   # the files the package ships
          node -e 'const t = require("/tmp/npm/package"); if (t.VERSION !== process.env.V) process.exit(1); console.log("node", t.VERSION)'
          node --input-type=module -e 'import t from "/tmp/npm/package/lib/index.mjs"; console.log("esm", t.VERSION)'
          # One install brings the agent (D-067): the extra on PyPI, the optional dependency on npm.
          # The agent release the extra names must be published first.
          /tmp/py/bin/pip download --quiet --dest /tmp/withagent "$(ls /tmp/dist/tellproof-*.whl)[agent]"   # resolves the extra on PyPI
          /tmp/py/bin/pip install --quiet /tmp/withagent/*.whl
          /tmp/py/bin/tellproof version | grep '^tellproof-agent v'
          npx --yes --package "/tmp/tellproof-$V.tgz" -- tellproof version | grep '^tellproof-agent v'

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r .github/requirements/build.txt && python -m build sdk/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    # Staged publishing (D-062): staged with tellproof's npm trusted publisher
    # (this repository, workflow sdk-release.yml, environment release;
    # stage-only); live once a maintainer approves it with 2FA on npmjs.com.
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npx --yes "npm@$NPM_VERSION" --version
      - name: Stage for approval on npmjs.com (skipped when on npm or already staged)
        working-directory: sdk/js
        run: |
          npm() { npx --yes "npm@$NPM_VERSION" "$@"; }
          spec="$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')"
          if npm view "$spec" version > /dev/null 2>&1; then echo "$spec is already on npm"; exit 0; fi
          if npm stage publish --access public 2> err.txt; then
            echo "### npm: \`$spec\` staged; approve it on npmjs.com → Staged Packages" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q E409 err.txt; then
            echo "$spec is already staged"
          else
            cat err.txt; exit 1
          fi
