# Publishes the SDKs (PyPI and npm, both named tellproof) when a maintainer
# pushes a tag sdk-vX.Y.Z whose version matches sdk/python/pyproject.toml and
# sdk/js/package.json (D-050), after a smoke test of both built packages and
# approval in the `release` environment, with trusted publishing on both
# registries (GitHub's OIDC token; no registry token is stored) (D-061).
name: sdk-release
on:
  push:
    tags: ["sdk-v*"]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs: { version: "${{ steps.v.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - id: v
        run: |
          v="${GITHUB_REF_NAME#sdk-v}"
          py=$(python -c 'import tomllib; print(tomllib.load(open("sdk/python/pyproject.toml","rb"))["project"]["version"])')
          js=$(node -p 'require("./sdk/js/package.json").version')
          [ "$py" = "$v" ] && [ "$js" = "$v" ] || { echo "tag $v, pyproject $py, package.json $js"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: python -m unittest discover -s sdk/python/tests
      - run: node --test sdk/js/test/sdk.test.mjs sdk/js/test/instrument.test.mjs
      - name: Smoke test (build both packages, install them, import them)
        env: { V: "${{ steps.v.outputs.version }}" }
        run: |
          python -m venv /tmp/py && /tmp/py/bin/pip install --quiet build
          /tmp/py/bin/python -m build sdk/python --outdir /tmp/dist > /dev/null
          /tmp/py/bin/pip install --quiet /tmp/dist/tellproof-*.whl
          /tmp/py/bin/python -c "import os, tellproof; assert tellproof.__version__ == os.environ['V']; print('python', tellproof.__version__)"
          (cd sdk/js && npm pack --pack-destination /tmp > /dev/null)
          mkdir -p /tmp/npm && cd /tmp/npm && npm init -y > /dev/null && npm install --no-audit --no-fund "/tmp/tellproof-$V.tgz" > /dev/null
          node -e 'const t = require("tellproof"); if (t.VERSION !== process.env.V) process.exit(1); console.log("node", t.VERSION)'
          node --input-type=module -e 'import t from "tellproof"; console.log("esm", t.VERSION)'

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build sdk/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    # Needs an npm trusted publisher on tellproof: this repository, workflow
    # sdk-release.yml, environment release. npm adds provenance automatically.
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@^11.5.1 && npm --version   # trusted publishing needs npm 11.5.1+
      - name: Publish (trusted publishing; skipped when the version is on npm)
        working-directory: sdk/js
        run: |
          spec="$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')"
          if npm view "$spec" version > /dev/null 2>&1; then echo "$spec is already on npm"; else npm publish --access public; fi
