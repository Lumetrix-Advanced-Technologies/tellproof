# Temporary. npm limits how often an account may create new packages, so the
# first publish of each Tellproof npm package is spread out: every three hours
# this publishes at most one package that is not on npm yet, with the
# repository secret NPM_TOKEN. Agent packages come from the latest release
# (the tarballs packages.yml built and attested); the SDK from its latest
# sdk-v* tag. A rate-limit refusal waits for the next run. With no secret, or
# with everything on npm, it does nothing. Delete this file and the secret
# once every package is on npm; later versions use trusted publishing.
name: npm-first-publish
on:
  schedule: [{ cron: "17 */3 * * *" }]
  workflow_dispatch:
permissions: { contents: read, attestations: read }
concurrency: { group: npm-first-publish, cancel-in-progress: false }
jobs:
  publish-one:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "No NPM_TOKEN secret, nothing to do."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - if: env.HAS_TOKEN == 'true'
        name: Publish the next package that is not on npm
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          set -euo pipefail
          mkdir -p pkg
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'tellproof-agent-*.tgz' -D pkg
          for f in pkg/*.tgz; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/packages.yml" > /dev/null
          done
          sdk_tag=$(git tag -l 'sdk-v*' --sort=-v:refname | head -1)
          git -c advice.detachedHead=false checkout -q "$sdk_tag"
          (cd sdk/js && npm pack --pack-destination ../../pkg > /dev/null)
          order=$(ls pkg/tellproof-agent-*-*-[0-9]*.tgz; ls pkg/tellproof-agent-[0-9]*.tgz; ls pkg/tellproof-[0-9]*.tgz)
          for t in $order; do
            spec=$(tar xzOf "$t" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + "@" + p.version')
            if npm view "$spec" version > /dev/null 2>&1; then echo "$spec is already on npm"; continue; fi
            echo "Publishing $spec"
            if npm publish "$t" --access public 2> err.txt; then echo "Published $spec"; exit 0; fi
            cat err.txt
            if grep -q E429 err.txt; then echo "::warning::npm rate limit on $spec; the next scheduled run tries again."; exit 0; fi
            exit 1
          done
          echo "::notice::Every Tellproof package is on npm: delete this workflow and the NPM_TOKEN secret."
