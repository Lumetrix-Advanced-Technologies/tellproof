# The agent for pip and npm (D-054), built from a published release's own
# binaries: it runs when a release is published, or by hand for any release
# tag. Packages are built only from binaries whose checksums match the
# release's SHA256SUMS and whose provenance says release.yml built them, then
# attested and attached to the release, after a smoke test installs them and
# runs the agent. Publishing to PyPI and npm runs only when the repository
# variable PUBLISH_PACKAGES is "true", after approval in the `release`
# environment, through trusted publishing on both (GitHub's OIDC token; no
# registry token is stored) (D-061).
name: packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package, for example v0.2.0
        required: true
permissions: {}
concurrency: { group: "packages-${{ github.event.release.tag_name || inputs.tag }}", cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Download the release's binaries and check them
        run: |
          mkdir -p dist && cd dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS
          # Only the agent binaries the release built (listed in SHA256SUMS), not
          # the packages an earlier run of this workflow attached.
          files=$(awk '$2 ~ /^tellproof-agent-/ && $2 !~ /bedrock/ {print $2}' SHA256SUMS)
          for f in $files; do gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$f"; done
          grep -F -f <(printf '%s\n' $files) SHA256SUMS | sha256sum -c -
          for f in $files; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" > /dev/null
          done
          ls
      - name: Build the wheels and npm packages
        run: |
          v="${TAG#v}"
          python3 packaging/build_wheels.py --dist dist --version "$v" --out pkg/pypi
          python3 packaging/build_npm.py --dist dist --version "$v" --out pkg/npm
          mkdir -p pkg/tarballs
          for d in pkg/npm/*/; do (cd "$d" && npm pack --pack-destination "$GITHUB_WORKSPACE/pkg/tarballs" > /dev/null); done
          ls -l pkg/pypi pkg/tarballs
      - name: Smoke test (install the packages for this runner and run the agent)
        run: |
          v="${TAG#v}"
          python3 -m venv /tmp/py && /tmp/py/bin/pip install --quiet pkg/pypi/tellproof_agent-*manylinux*x86_64*.whl
          /tmp/py/bin/tellproof-agent version | grep -qx "tellproof-agent v$v"
          mkdir -p /tmp/npm && cd /tmp/npm && npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/pkg/tarballs/tellproof-agent-linux-x64-*.tgz "$GITHUB_WORKSPACE"/pkg/tarballs/tellproof-agent-[0-9]*.tgz > /dev/null
          npx --no-install tellproof-agent version | grep -qx "tellproof-agent v$v"
          echo "pip and npm packages install and run: tellproof-agent v$v"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            pkg/pypi/*.whl
            pkg/tarballs/*.tgz
      - name: Attach them to the release
        run: gh release upload "$TAG" pkg/pypi/*.whl pkg/tarballs/*.tgz -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with: { name: packages, path: pkg, if-no-files-found: error }

  pypi:
    # Needs a PyPI trusted publisher for tellproof-agent: this repository,
    # workflow packages.yml, environment release.
    needs: build
    if: vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: packages, path: pkg }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: pkg/pypi, skip-existing: true }

  npm:
    # Staged publishing (D-062): each version is staged with the package's npm
    # trusted publisher (this repository, workflow packages.yml, environment
    # release; stage-only) and goes live only when a maintainer approves it
    # with 2FA in npmjs.com's Staged Packages, platform packages before
    # tellproof-agent so its optional dependencies exist when it lands.
    # Versions already on npm, or already staged, are skipped.
    needs: build
    if: vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g "npm@>=11.15.0 <13" && npm --version   # npm stage needs npm 11.15.0+
      - uses: actions/download-artifact@v4
        with: { name: packages, path: pkg }
      - name: Stage for approval on npmjs.com
        run: |
          stage() {
            spec=$(tar xzOf "$1" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + "@" + p.version')
            if npm view "$spec" version > /dev/null 2>&1; then echo "$spec is already on npm"; return; fi
            # "./": a bare dir/x.tgz is read as a GitHub owner/repo.
            if npm stage publish "./$1" --access public 2> err.txt; then
              echo "- \`$spec\` staged" >> "$GITHUB_STEP_SUMMARY"
            elif grep -q E409 err.txt; then
              echo "$spec is already staged"; echo "- \`$spec\` was already staged" >> "$GITHUB_STEP_SUMMARY"
            else
              cat err.txt; return 1
            fi
          }
          echo "### npm: approve on npmjs.com → Staged Packages, platform packages first" >> "$GITHUB_STEP_SUMMARY"
          for t in pkg/tarballs/tellproof-agent-*-*.tgz; do stage "$t"; done
          stage pkg/tarballs/tellproof-agent-[0-9]*.tgz
