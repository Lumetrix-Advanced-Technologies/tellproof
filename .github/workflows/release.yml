# Releases tellproof-verify and tellproof-agent when a maintainer pushes a tag
# vX.Y.Z (D-050). Binaries are built per platform from this repository's
# source, checksummed, and attested together with the release notes (GitHub
# artifact attestations: Sigstore-signed SLSA provenance tied to this workflow
# and commit). The GitHub release is created as a draft for a maintainer to
# publish; the container image waits for approval in the `release` environment.
# Publishing the release starts packages.yml, which builds the pip and npm
# packages from these binaries.
#
# Check a download:
#   sha256sum --ignore-missing -c SHA256SUMS
#   gh attestation verify tellproof-verify-linux-amd64 --repo lumetrix-advanced-technologies/tellproof
#   gh attestation verify RELEASE-NOTES.md --repo lumetrix-advanced-technologies/tellproof
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency: { group: release, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r .github/requirements/ci.txt   # cryptography, pinned by hash (Dependabot updates it)
      - run: make check
      - name: The tag has release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
      - name: The Action installs this release by default
        run: |
          got=$(sed -n '/^  version:/,/default:/s/^ *default: *"\(.*\)"$/\1/p' action.yml)
          [ "$got" = "${GITHUB_REF_NAME#v}" ] || { echo "action.yml's version default is '$got', the tag is $GITHUB_REF_NAME" >&2; exit 1; }

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: read }
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27" }
      - run: make release-binaries GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tellproof-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: bin-*, path: dist, merge-multiple: true }
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > dist/RELEASE-NOTES.md
      - run: make release-sums
      - name: Version check
        run: |
          chmod +x dist/tellproof-verify-linux-amd64 dist/tellproof-agent-linux-amd64
          dist/tellproof-verify-linux-amd64 --version | grep -qx "tellproof-verify $GITHUB_REF_NAME"
          dist/tellproof-agent-linux-amd64 version | grep -q "tellproof-agent $GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with: { subject-path: "dist/*" }
      - name: Provenance as a release asset
        # The same Sigstore bundle as the attestation, one JSON line, so a
        # verifier (and OpenSSF Scorecard) finds it next to the binaries.
        env: { BUNDLE: "${{ steps.attest.outputs.bundle-path }}" }
        run: python3 -c 'import json, sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' "$BUNDLE" > "dist/tellproof-$GITHUB_REF_NAME.intoto.jsonl"
      - name: Draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Tellproof $GITHUB_REF_NAME" --notes-file dist/RELEASE-NOTES.md dist/*

  image:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    env: { IMAGE: ghcr.io/lumetrix-advanced-technologies/tellproof-agent }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.push.outputs.digest }}", push-to-registry: true }
