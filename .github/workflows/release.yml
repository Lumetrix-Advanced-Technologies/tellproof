# Releases tellproof-verify and tellproof-agent when a maintainer pushes a tag
# vX.Y.Z (D-050). Binaries are built per platform from this repository's
# source, checksummed, and attested together with the release notes (GitHub
# artifact attestations: Sigstore-signed SLSA provenance tied to this workflow
# and commit). The GitHub release is created as a draft for a maintainer to
# publish; the container image waits for approval in the `release` environment.
# Publishing the release starts packages.yml, which builds the pip and npm
# packages from these binaries.
#
# Check a download:
#   sha256sum --ignore-missing -c SHA256SUMS
#   gh attestation verify tellproof-verify-linux-amd64 --repo lumetrix-advanced-technologies/tellproof
#   gh attestation verify RELEASE-NOTES.md --repo lumetrix-advanced-technologies/tellproof
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency: { group: release, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: "1.27" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install cryptography
      - run: make check
      - name: The tag has release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
      - name: The Action installs this release by default
        run: |
          got=$(sed -n '/^  version:/,/default:/s/^ *default: *"\(.*\)"$/\1/p' action.yml)
          [ "$got" = "${GITHUB_REF_NAME#v}" ] || { echo "action.yml's version default is '$got', the tag is $GITHUB_REF_NAME" >&2; exit 1; }

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: read }
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: "1.27" }
      - run: make release-binaries GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tellproof-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: bin-*, path: dist, merge-multiple: true }
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > dist/RELEASE-NOTES.md
      - run: make release-sums
      - name: Version check
        run: |
          chmod +x dist/tellproof-verify-linux-amd64 dist/tellproof-agent-linux-amd64
          dist/tellproof-verify-linux-amd64 --version | grep -qx "tellproof-verify $GITHUB_REF_NAME"
          dist/tellproof-agent-linux-amd64 version | grep -q "tellproof-agent $GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: "dist/*" }
      - name: Draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Tellproof $GITHUB_REF_NAME" --notes-file dist/RELEASE-NOTES.md dist/*

  image:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    env: { IMAGE: ghcr.io/lumetrix-advanced-technologies/tellproof-agent }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: cmd/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:latest
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.push.outputs.digest }}", push-to-registry: true }
