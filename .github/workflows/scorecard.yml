# OpenSSF Scorecard (D-063): checks this repository's supply-chain practices
# (pinned actions, token permissions, branch protection, signed releases and
# more) weekly, on pushes to main and when branch protection changes. Results
# go to the Security tab and to the public badge in the README.
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with: { results_file: results.sarif, results_format: sarif, publish_results: true }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: scorecard, path: results.sarif, retention-days: 5 }
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with: { sarif_file: results.sarif }
